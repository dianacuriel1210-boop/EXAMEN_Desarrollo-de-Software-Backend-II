
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Concesionaria | Registrar auto</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #eeeeee;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #151515;
            border-bottom: 4px solid #dc3545;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-header {
            background-color: #151515;
            color: white;
            border-bottom: 4px solid #dc3545;
            padding: 20px;
        }

        .form-control {
            padding: 11px;
            border-radius: 7px;
        }

        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.2);
        }

        .btn-danger {
            background-color: #dc3545;
            border: none;
            padding: 11px;
        }

        .btn-danger:hover {
            background-color: #b02a37;
        }

        footer {
            background-color: #151515;
            color: white;
            border-top: 4px solid #dc3545;
            margin-top: 60px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="{% url 'lista_autos' %}">
             CONCESIONARIA
        </a>
    </div>
</nav>

<div class="container mt-5 mb-5">

    <div class="card shadow mx-auto" style="max-width: 600px;">

        <div class="card-header">
            <h3 class="mb-0">Registrar nuevo auto</h3>
            <small>Completa los datos del vehículo</small>
        </div>

        <div class="card-body p-4">

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-bold">Marca</label>
                    {{ formulario.marca }}
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Modelo</label>
                    {{ formulario.modelo }}
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Año</label>
                    {{ formulario.año }}
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Precio</label>
                    {{ formulario.precio }}
                </div>

                <button type="submit" class="btn btn-danger w-100">
                    Guardar auto
                </button>

            </form>

            <a href="{% url 'lista_autos' %}"
               class="btn btn-outline-dark w-100 mt-3">
                Volver a autos registrados
            </a>

        </div>
    </div>

</div>

<footer>
    <p class="mb-0">© 2026 Concesionaria | Sistema de gestión de autos</p>
</footer>

</body>
</html>
